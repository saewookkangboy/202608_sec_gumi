<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 project/ 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F4F7FA;
      --color-ink:     #071018;
      --color-muted:   #526476;
      --color-accent:  #146EF5;
      --color-link:    #1428A0;
      --font-sans:     'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · MX Gumi Agentic AI</p>
    <h1>Day 5 project/ 폴더</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-day5-title arch-day5-desc">

      <desc id="arch-day5-desc">final-prd.md, knowledge/, mcp/, agents/와 harness 검증 경계.</desc>

      <rect width="100%" height="100%" fill="#F4F7FA"/>

      <rect x="52" y="40" width="120" height="16" rx="2" fill="#F4F7FA"/>
      <text x="112" y="51" text-anchor="middle" fill="#146EF5" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="1.5">HARNESS · validate · AGENTS.md</text>

      <line x1="500" y1="120" x2="500" y2="152" stroke="#526476" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="224" x2="280" y2="256" stroke="#526476" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="224" x2="500" y2="256" stroke="#146EF5" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="720" y1="224" x2="720" y2="256" stroke="#526476" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="320" y="80" width="360" height="64" rx="6" fill="#FFFFFF" stroke="#1428A0" stroke-width="1"/>

      <text x="346" y="97" fill="#1428A0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRD</text>
      <text x="500" y="116" fill="#071018" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">final-prd.md · Canvas 1~10</text>

      <text x="500" y="308" fill="#526476" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 tools · smoke PASS</text>

      <!-- Agents -->
      <rect x="680" y="256" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#071018" stroke-width="1"/>
      <text x="780" y="288" fill="#071018" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agents</text>
      <text x="780" y="308" fill="#526476" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HITL · role contracts</text>

      <!-- Evidence footer -->
      <rect x="120" y="360" width="760" height="56" rx="6" fill="#E8EDF2" stroke="rgba(7,16,24,0.12)" stroke-width="1"/>
      <text x="140" y="384" fill="#8293A5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EVIDENCE</text>
      <text x="140" y="404" fill="#071018" font-size="12" font-family="'Geist', sans-serif">project/evidence/ · Day 2~4 테스트 · validate_day5.py</text>

      <line x1="40" y1="468" x2="960" y2="468" stroke="rgba(7,16,24,0.10)" stroke-width="0.8"/>
      <text x="40" y="484" fill="#526476" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="120" y="476" width="12" height="12" rx="2" fill="rgba(20,110,245,0.08)" stroke="#146EF5" stroke-width="1"/>
      <text x="140" y="486" fill="#526476" font-size="8.5" font-family="'Geist', sans-serif">강조: knowledge (Day 2)</text>
      <rect x="320" y="476" width="12" height="12" rx="2" fill="none" stroke="#146EF5" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="340" y="486" fill="#526476" font-size="8.5" font-family="'Geist', sans-serif">harness 경계</text>
    </svg>
  </div>
</body>
</html>

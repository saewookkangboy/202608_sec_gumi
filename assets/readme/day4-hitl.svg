  <title id="title">Day 4 HITL and HOTL control</title>
  <desc id="desc">HITL pauses at AWAITING_APPROVAL until --approve. HOTL watches events.jsonl and escalates after three persistent faults. A2A is advanced agent-to-agent.</desc>

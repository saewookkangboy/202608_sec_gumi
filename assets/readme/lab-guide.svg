<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">GitHub copy lab for Day 1 to Day 4</title>
  <desc id="desc">Instructors deploy main. Students copy prompts and skills, run checks, push team branches.</desc>
  <rect width="1200" height="390" rx="28" fill="#071018"/>
  <path d="M0 360H1200" stroke="#223141" stroke-width="1"/>
  <path d="M700 0V360" stroke="#223141" stroke-width="1"/>

  <g transform="translate(52 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="0" y="0" fill="#43C6FF" font-size="18" font-weight="700" letter-spacing="2">LAB GUIDE · GITHUB COPY</text>
    <text x="0" y="72" fill="#F5F7FA" font-size="42" font-weight="800">명령을 복사해</text>
    <text x="0" y="124" fill="#F5F7FA" font-size="42" font-weight="800">4일 실습을 제출합니다.</text>
    <text x="0" y="168" fill="#C9D4DF" font-size="21">강사는 main, 수강생은 team 브랜치.</text>
    <g transform="translate(0 200)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="108" height="40" rx="8" fill="#102338" stroke="#1428A0"/>
      <text x="14" y="26" fill="#F5F7FA" font-size="17">4 DAYS</text>
      <rect x="120" width="108" height="40" rx="8" fill="#102338" stroke="#146EF5"/>
      <text x="134" y="26" fill="#F5F7FA" font-size="17">9 SKILLS</text>
      <rect x="240" width="176" height="40" rx="8" fill="#102338" stroke="#146EF5"/>
      <text x="254" y="26" fill="#F5F7FA" font-size="17">team/*</text>
    </g>
  </g>

  <g transform="translate(740 36)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="0" y="0" fill="#8293A5" font-size="18" font-weight="700" letter-spacing="2">COPY PATH</text>
    <g transform="translate(0 28)">
      <rect width="408" height="58" rx="12" fill="#0D1C29" stroke="#1428A0" stroke-width="2"/>
      <rect width="58" height="58" rx="12" fill="#1428A0"/>
      <text x="16" y="36" fill="#FFFFFF" font-size="20" font-weight="800">01</text>
      <text x="78" y="26" fill="#F5F7FA" font-size="18" font-weight="700">PRD</text>
      <text x="78" y="46" fill="#9FB0C0" font-size="16">prompt.md 복사</text>
    </g>
    <g transform="translate(0 98)">
      <rect width="408" height="58" rx="12" fill="#0D1C29" stroke="#146EF5" stroke-width="2"/>
      <rect width="58" height="58" rx="12" fill="#146EF5"/>
      <text x="16" y="36" fill="#FFFFFF" font-size="20" font-weight="800">02</text>
      <text x="78" y="26" fill="#F5F7FA" font-size="18" font-weight="700">SKILL</text>
      <text x="78" y="46" fill="#9FB0C0" font-size="16">Day 2~4 repo skill</text>
    </g>
    <g transform="translate(0 168)">
      <rect width="408" height="58" rx="12" fill="#0D1C29" stroke="#43C6FF" stroke-width="2"/>
      <rect width="58" height="58" rx="12" fill="#123B50"/>
      <text x="16" y="36" fill="#FFFFFF" font-size="20" font-weight="800">03</text>
      <text x="78" y="26" fill="#F5F7FA" font-size="18" font-weight="700">TEST</text>
      <text x="78" y="46" fill="#9FB0C0" font-size="16">validate · unittest · smoke</text>
    </g>
    <g transform="translate(0 238)">
      <rect width="408" height="58" rx="12" fill="#0D1C29" stroke="#F5C542" stroke-width="2"/>
      <rect width="58" height="58" rx="12" fill="#4A3A12"/>
      <text x="16" y="36" fill="#FFFFFF" font-size="20" font-weight="800">04</text>
      <text x="78" y="26" fill="#F5F7FA" font-size="18" font-weight="700">PUSH</text>
      <text x="78" y="46" fill="#9FB0C0" font-size="16">team 브랜치 제출</text>
    </g>
  </g>

  <g transform="translate(52 378)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">
    <circle cx="7" cy="-5" r="6" fill="#46D68C"/>
    <text x="24" y="0" fill="#9FB0C0">CURRICULUM-4DAY.md</text>
    <text x="1060" y="0" text-anchor="end" fill="#596D80">TRAINING DATA ONLY</text>
  </g>

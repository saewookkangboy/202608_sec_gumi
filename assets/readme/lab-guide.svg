<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">GitHub copy lab for Day 2 to Day 4</title>
  <desc id="desc">Instructors deploy main after tests. Students copy Claude or Codex skill prompts, run checks, and push team branches.</desc>
  <rect width="1200" height="390" rx="28" fill="#071018"/>
  <path d="M0 360H1200" stroke="#223141" stroke-width="1"/>
  <path d="M700 0V360" stroke="#223141" stroke-width="1"/>

  <g transform="translate(52 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="0" y="0" fill="#43C6FF" font-size="18" font-weight="700" letter-spacing="2">LAB GUIDE · GITHUB COPY</text>
    <text x="0" y="72" fill="#F5F7FA" font-size="42" font-weight="800">명령을 복사해</text>
    <text x="0" y="124" fill="#F5F7FA" font-size="42" font-weight="800">실습을 제출합니다.</text>
    <text x="0" y="168" fill="#C9D4DF" font-size="21">강사는 main, 수강생은 team 브랜치.</text>
    <g transform="translate(0 200)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="148" height="40" rx="8" fill="#102338" stroke="#146EF5"/>
      <text x="16" y="26" fill="#F5F7FA" font-size="18">COPY</text>
      <rect x="160" width="148" height="40" rx="8" fill="#102338" stroke="#146EF5"/>
      <text x="176" y="26" fill="#F5F7FA" font-size="18">8 SKILLS</text>
      <rect x="320" width="176" height="40" rx="8" fill="#102338" stroke="#146EF5"/>
      <text x="336" y="26" fill="#F5F7FA" font-size="18">team/*</text>
    </g>
  </g>

  <g transform="translate(740 36)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="0" y="0" fill="#8293A5" font-size="18" font-weight="700" letter-spacing="2">COPY PATH</text>
    <g transform="translate(0 28)">
      <rect width="408" height="64" rx="14" fill="#0D1C29" stroke="#146EF5" stroke-width="2"/>
      <rect width="72" height="64" rx="14" fill="#146EF5"/>
      <text x="22" y="40" fill="#FFFFFF" font-size="22" font-weight="800">01</text>
      <text x="92" y="28" fill="#F5F7FA" font-size="20" font-weight="700">COPY</text>
      <text x="92" y="50" fill="#9FB0C0" font-size="18">GitHub 블록 복사</text>
    </g>
    <path d="M204 92V108" stroke="#43C6FF" stroke-width="3"/>
    <path d="M196 101L204 110L212 101" fill="none" stroke="#43C6FF" stroke-width="3"/>
    <g transform="translate(0 112)">
      <rect width="408" height="64" rx="14" fill="#0D1C29" stroke="#43C6FF" stroke-width="2"/>
      <rect width="72" height="64" rx="14" fill="#123B50"/>
      <text x="22" y="40" fill="#FFFFFF" font-size="22" font-weight="800">02</text>
      <text x="92" y="28" fill="#F5F7FA" font-size="20" font-weight="700">SKILL</text>
      <text x="92" y="50" fill="#9FB0C0" font-size="18">/skill 또는 $skill</text>
    </g>
    <path d="M204 176V192" stroke="#F5C542" stroke-width="3"/>
    <path d="M196 185L204 194L212 185" fill="none" stroke="#F5C542" stroke-width="3"/>
    <g transform="translate(0 196)">
      <rect width="408" height="64" rx="14" fill="#0D1C29" stroke="#F5C542" stroke-width="2"/>
      <rect width="72" height="64" rx="14" fill="#4A3A12"/>
      <text x="22" y="40" fill="#FFFFFF" font-size="22" font-weight="800">03</text>
      <text x="92" y="28" fill="#F5F7FA" font-size="20" font-weight="700">TEST · PUSH</text>
      <text x="92" y="50" fill="#9FB0C0" font-size="18">검증 후 team 브랜치</text>
    </g>
  </g>

  <g transform="translate(52 381)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">
    <circle cx="7" cy="-5" r="6" fill="#46D68C"/>
    <text x="24" y="0" fill="#9FB0C0">CLONE → COPY → TEST → team/$TEAM_NAME</text>
    <text x="1096" y="0" text-anchor="end" fill="#596D80">NO LIVE SECRETS</text>
  </g>
</svg>

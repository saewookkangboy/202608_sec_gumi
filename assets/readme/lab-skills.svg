<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Day 2 to Day 4 skills to paste</title>
  <desc id="desc">Day 2 harness skills, Day 3 MCP skills, Day 4 four roles in order. Claude uses slash names, Codex uses dollar names.</desc>
  <rect width="1200" height="250" rx="22" fill="#071018"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <g transform="translate(28 28)">
      <rect width="364" height="194" rx="16" fill="#0D1C29" stroke="#146EF5" stroke-width="2"/>
      <rect width="364" height="12" rx="6" fill="#146EF5"/>
      <text x="22" y="52" fill="#43C6FF" font-size="18" font-weight="700" letter-spacing="1.4">DAY 02 · HARNESS</text>
      <text x="22" y="92" fill="#F5F7FA" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/eco-knowledge-builder</text>
      <text x="22" y="122" fill="#F5F7FA" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/repo-harness-auditor</text>
      <text x="22" y="164" fill="#9FB0C0" font-size="18">Codex는 $skill-name</text>
    </g>
    <g transform="translate(418 28)">
      <rect width="364" height="194" rx="16" fill="#0D1C29" stroke="#43C6FF" stroke-width="2"/>
      <rect width="364" height="12" rx="6" fill="#43C6FF"/>
      <text x="22" y="52" fill="#43C6FF" font-size="18" font-weight="700" letter-spacing="1.4">DAY 03 · LOOP</text>
      <text x="22" y="92" fill="#F5F7FA" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/mcp-tool-designer</text>
      <text x="22" y="122" fill="#F5F7FA" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/mcp-smoke-test</text>
      <text x="22" y="164" fill="#9FB0C0" font-size="18">MCP 연결 후 복사</text>
    </g>
    <g transform="translate(808 28)">
      <rect width="364" height="194" rx="16" fill="#0D1C29" stroke="#F5C542" stroke-width="2"/>
      <rect width="364" height="12" rx="6" fill="#F5C542"/>
      <text x="22" y="52" fill="#F5C542" font-size="18" font-weight="700" letter-spacing="1.4">DAY 04 · CONTROL</text>
      <text x="22" y="92" fill="#F5F7FA" font-size="20">plan → execute</text>
      <text x="22" y="122" fill="#F5F7FA" font-size="20">verify → human</text>
      <text x="22" y="164" fill="#9FB0C0" font-size="18">역할은 섞지 않음</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Learning path Day 2 to Day 4</title>
  <desc id="desc">Harness and eval, then MCP loop and E2E, then HITL pause and HOTL escalation.</desc>
  <rect width="1200" height="470" rx="24" fill="#F4F7FA"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="56" y="62" fill="#071018" font-size="36" font-weight="800">하나의 과제를 세 계약으로 확장합니다</text>
    <text x="56" y="96" fill="#526476" font-size="20">Harness → Loop/E2E → HITL/HOTL. Claude Code와 Codex가 같은 파일을 읽습니다.</text>
    <path d="M354 250H423" stroke="#146EF5" stroke-width="4"/>
    <path d="M413 240L425 250L413 260" fill="none" stroke="#146EF5" stroke-width="4"/>
    <path d="M776 250H845" stroke="#146EF5" stroke-width="4"/>
    <path d="M835 240L847 250L835 260" fill="none" stroke="#146EF5" stroke-width="4"/>
    <g transform="translate(56 132)">
      <rect width="298" height="274" rx="18" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="2"/>
      <rect width="298" height="12" rx="6" fill="#146EF5"/>
      <text x="24" y="55" fill="#146EF5" font-size="18" font-weight="800" letter-spacing="1.5">DAY 02 · HARNESS</text>
      <text x="24" y="94" fill="#071018" font-size="26" font-weight="800">원본을 잠그고 평가</text>
      <text x="24" y="132" fill="#526476" font-size="19">source_id와 SHA-256으로</text>
      <text x="24" y="160" fill="#526476" font-size="19">Top-3 eval을 고정</text>
      <path d="M24 184H274" stroke="#E0E7EE"/>
      <text x="24" y="219" fill="#071018" font-size="19" font-weight="700">CONCEPT</text>
      <text x="24" y="249" fill="#526476" font-size="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Eval · Graph*</text>
    </g>
    <g transform="translate(425 132)">
      <rect width="351" height="274" rx="18" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="2"/>
      <rect width="351" height="12" rx="6" fill="#43C6FF"/>
      <text x="24" y="55" fill="#147D9E" font-size="18" font-weight="800" letter-spacing="1.5">DAY 03 · LOOP</text>
      <text x="24" y="94" fill="#071018" font-size="26" font-weight="800">도구 루프를 E2E로</text>
      <text x="24" y="132" fill="#526476" font-size="19">initialize부터 쓰기 차단까지</text>
      <text x="24" y="160" fill="#526476" font-size="19">한 프로세스로 검증</text>
      <path d="M24 184H327" stroke="#E0E7EE"/>
      <text x="24" y="219" fill="#071018" font-size="19" font-weight="700">CONCEPT</text>
      <text x="24" y="249" fill="#526476" font-size="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">MCP · E2E smoke</text>
    </g>
    <g transform="translate(847 132)">
      <rect width="297" height="274" rx="18" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="2"/>
      <rect width="297" height="12" rx="6" fill="#F5C542"/>
      <text x="24" y="55" fill="#876900" font-size="18" font-weight="800" letter-spacing="1.5">DAY 04 · CONTROL</text>
      <text x="24" y="94" fill="#071018" font-size="26" font-weight="800">멈추고 관찰하고</text>
      <text x="24" y="132" fill="#526476" font-size="19">HITL은 승인 전 정지</text>
      <text x="24" y="160" fill="#526476" font-size="19">HOTL은 3회 후 이관</text>
      <path d="M24 184H273" stroke="#E0E7EE"/>
      <text x="24" y="219" fill="#071018" font-size="19" font-weight="700">CONCEPT</text>
      <text x="24" y="249" fill="#526476" font-size="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">HITL · HOTL · A2A*</text>
    </g>
  </g>
</svg>

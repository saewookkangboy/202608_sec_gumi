<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Day 2부터 Day 4까지의 에이전틱 AI 학습 경로</title>
  <desc id="desc">문서를 근거 있는 지식으로 만들고, MCP 도구로 연결한 뒤, 검증과 사람 승인으로 통제하는 세 단계 실습</desc>
  <rect width="1200" height="470" rx="24" fill="#F4F7FA"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="56" y="62" fill="#071018" font-size="38" font-weight="800">하나의 과제를 세 단계로 확장합니다</text>
    <text x="56" y="96" fill="#526476" font-size="20">문서 → 도구 → 역할·검증·승인으로 자동화의 신뢰 경계를 넓힙니다.</text>

    <path d="M354 250H423" stroke="#146EF5" stroke-width="4"/>
    <path d="M413 240L425 250L413 260" fill="none" stroke="#146EF5" stroke-width="4"/>
    <path d="M776 250H845" stroke="#146EF5" stroke-width="4"/>
    <path d="M835 240L847 250L835 260" fill="none" stroke="#146EF5" stroke-width="4"/>

    <g transform="translate(56 132)">
      <rect width="298" height="274" rx="18" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="2"/>
      <rect width="298" height="12" rx="6" fill="#146EF5"/>
      <text x="24" y="55" fill="#146EF5" font-size="19" font-weight="800" letter-spacing="2">DAY 02 · KNOWLEDGE</text>
      <text x="24" y="94" fill="#071018" font-size="27" font-weight="800">문서를 지식 자산으로</text>
      <text x="24" y="132" fill="#526476" font-size="19">ECO 12건을 정규화하고</text>
      <text x="24" y="160" fill="#526476" font-size="19">원본 경로와 문서 ID를 보존</text>
      <path d="M24 184H274" stroke="#E0E7EE"/>
      <text x="24" y="219" fill="#071018" font-size="19" font-weight="700">OUTPUT</text>
      <text x="24" y="249" fill="#526476" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">knowledge/catalog.json</text>
    </g>

    <g transform="translate(425 132)">
      <rect width="351" height="274" rx="18" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="2"/>
      <rect width="351" height="12" rx="6" fill="#43C6FF"/>
      <text x="24" y="55" fill="#147D9E" font-size="19" font-weight="800" letter-spacing="2">DAY 03 · TOOLS</text>
      <text x="24" y="94" fill="#071018" font-size="27" font-weight="800">지식을 MCP 도구로</text>
      <text x="24" y="132" fill="#526476" font-size="19">조회·오류 집계·승인 쓰기의</text>
      <text x="24" y="160" fill="#526476" font-size="19">입력·출력·권한 계약을 검증</text>
      <path d="M24 184H327" stroke="#E0E7EE"/>
      <text x="24" y="219" fill="#071018" font-size="19" font-weight="700">PROOF</text>
      <text x="24" y="249" fill="#526476" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">initialize → tools/list → call</text>
    </g>

    <g transform="translate(847 132)">
      <rect width="297" height="274" rx="18" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="2"/>
      <rect width="297" height="12" rx="6" fill="#F5C542"/>
      <text x="24" y="55" fill="#876900" font-size="19" font-weight="800" letter-spacing="2">DAY 04 · CONTROL</text>
      <text x="24" y="94" fill="#071018" font-size="27" font-weight="800">결정을 검증·승인으로</text>
      <text x="24" y="132" fill="#526476" font-size="19">결함 반려와 재시도 후에도</text>
      <text x="24" y="160" fill="#526476" font-size="19">사람 승인 전에는 최종 중단</text>
      <path d="M24 184H273" stroke="#E0E7EE"/>
      <text x="24" y="219" fill="#071018" font-size="19" font-weight="700">GATE</text>
      <text x="24" y="249" fill="#526476" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">AWAITING_APPROVAL</text>
    </g>
  </g>
</svg>
